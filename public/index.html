<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Startech - Premium Bangladesh eCommerce platform for PCs, laptops, gaming accessories, smartphones, and gadgets">
    <meta name="keywords" content="electronics, computer, laptop, gaming, Bangladesh, ecommerce">
    <meta name="author" content="Startech BD">
    <meta property="og:title" content="Startech - Premium Electronics Bangladesh">
    <meta property="og:description" content="Buy PCs, laptops, gaming accessories, smartphones online in Bangladesh">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://startech.bd">
    <meta name="theme-color" content="#081621">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS (will be overridden by Startech theme) -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #081621;
            --accent-red: #D51E0B;
            --white: #ffffff;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-900: #111827;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: var(--white);
            color: var(--gray-900);
        }

        html {
            scroll-behavior: smooth;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: var(--primary-dark);
                color: var(--gray-100);
            }
        }

        #root {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
    </style>

    <title>Startech - Premium Electronics Bangladesh</title>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
